name: nymeria
task_type: single_dataset
task_modes: []

shape_meta:
  image_resolution: 256  # Resize from 1408x1408 to 256x256 for efficiency
  action:
    shape:
    - 1  # Dummy action dimension (video-only training)
  obs:
    image:
      shape:
      - 3
      - 256
      - 256
      type: rgb

dataset:
  _target_: unified_video_action.dataset.nymeria_dataset.NymeriaUVADataset
  data_dir: /nfs/antzhan/nymeria/hdf5  # Update this path to your nymeria data location
  image_resolution: 256
  sequence_length: 150  # Nymeria sequences are ~150 frames
  val_ratio: 0.02
  seed: 42
  data_aug: true
  file_pattern: "*.h5"
  language_emb_model: null  # No language conditioning for video-only training
  normalizer_type: null  # No action normalization needed for video generation

# No env_runner needed for video-only training (no policy evaluation)
env_runner: null
