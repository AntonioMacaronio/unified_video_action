name: uva_nymeria

defaults:
  - _self_
  - task: nymeria
  - model: uva

# Override model flags for video-only training (match pretrained MAR model)
# Pretrained MAR expects 4 parts: [x, cond, action_latents, history_action_latents]
model:
  policy:
    use_history_action: true   # Pretrained model uses history actions (+1 → 4 parts total)
    use_proprioception: false  # No proprioception for video-only
    predict_wrist_img: false   # No wrist camera
    predict_proprioception: false  # No proprioception prediction
    different_history_freq: false

dataloader:
  batch_size: 16  # Reduced from 32 due to longer sequences (150 vs 32 frames)
  num_workers: 0 # 0 for debugging purposes
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 16
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

training:
  checkpoint_every: 10
  debug: false
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 3000  # Video generation training typically needs many epochs
  resume: true
  rollout_every: null  # No rollout for video-only training
  sample_every: 10  # Generate video samples every 10 epochs
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 5  # Validate every 5 epochs (less frequent due to longer sequences)
  mixed_precision: 'bf16'  # Changed to bf16 for better stability with DeepSpeed
  deepspeed_config: unified_video_action/config/zero2.json # zero3 has interesting deadlock issues

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    monitor_key: val_loss  # Use validation loss for video-only training
    format_str: epoch={epoch:04d}-val_loss={val_loss:.3f}.ckpt
    k: 3  # Keep top 3 checkpoints
    mode: min  # Lower loss is better

ema:
  _target_: unified_video_action.model.autoregressive.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

logging:
  group: null
  id: null
  mode: online
  name: train_uva_nymeria_video
  project: unified_video_action
  resume: true
  tags:
  - train_uva_nymeria
  - nymeria
  - video_generation
  - ego_motion

multi_run:
  run_dir: data/outputs/train_uva_nymeria_video
  wandb_name_base: train_uva_nymeria_video
